name: fork-desktop-linux

on:
  push:
    branches:
      - sidebar-navigation
      - perf-renderer-2
      - perf-desktop-main
  workflow_dispatch:

concurrency:
  group: fork-desktop-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENCODE_FORK: "1"

jobs:
  unit-tests:
    name: unit tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 45
        run: GITHUB_ACTIONS=false bun turbo test

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        working-directory: packages/opencode
        run: bun run test:httpapi

  typecheck:
    name: typecheck (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun turbo typecheck

  e2e:
    name: e2e (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 40

  build-linux:
    name: build desktop (linux x64)
    needs: [unit-tests, typecheck]
    # Full packaging runs only for the release branch; phase branches verify with tests.
    if: github.ref == 'refs/heads/sidebar-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=linux --cpu=x64

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install rpm packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./packages/desktop/package.json').version")
          VERSION="${BASE}-sidebar.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building OpenCode Desktop version $VERSION"

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: x86_64-unknown-linux-gnu

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: prod

      - name: Package
        run: npx electron-builder --linux --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod

      - name: List packaged artifacts
        run: ls -lh packages/desktop/dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-linux-x64
          path: packages/desktop/dist/*

  release:
    name: create release
    needs: [build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/sidebar-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-desktop-linux-x64
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-linux.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*.{AppImage,deb,rpm,blockmap} dist/latest*.yml dist/latest*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release assets found"
            exit 1
          fi
          TAG="v${VERSION}"
          NOTES="Fork build of anomalyco/opencode with the sidebar navigation feature. Commit: ${{ github.sha }}"
          gh release create "$TAG" "${files[@]}" \
            --title "OpenCode Desktop $TAG" \
            --notes "$NOTES" \
            --prerelease \
            --target "${{ github.sha }}"
